apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-app
  labels: { app: domain-app }
spec:
  replicas: 2
  selector:
    matchLabels: { app: domain-app }
  template:
    metadata:
      labels: { app: domain-app }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: ghcr.io/example/domain-app:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
