apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: domain-app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: [example.com]
      secretName: domain-app-tls
  rules:
    - host: example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: domain-app
                port: { number: 80 }
