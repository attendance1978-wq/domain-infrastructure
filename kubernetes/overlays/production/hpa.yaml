apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: domain-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: domain-app
  minReplicas: 5
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
