name: terraform-plan
on:
  pull_request:
    paths: ["terraform/**"]
jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, production]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform -chdir=terraform/environments/${{ matrix.env }} init -input=false
      - run: terraform -chdir=terraform/environments/${{ matrix.env }} validate
      - run: terraform -chdir=terraform/environments/${{ matrix.env }} plan -input=false -no-color
